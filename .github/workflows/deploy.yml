name: Deploy to Azure App Service
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_VERSION: '10.0'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}.x'

      - name: Build and publish
        run: |
          dotnet restore AccessApp/AccessApp.csproj
          dotnet publish AccessApp/AccessApp.csproj -c Release -o ./publish

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"3276c94e-46bc-423e-bd3e-86f3d8ff268e","clientSecret":"pgA8Q~YCj9d_gyK4OtMnJST1WmEXp.o3dSJdvcdI","tenantId":"16b3c013-d300-468d-ac64-7eda0820b6d3","subscriptionId":"7e5e0ef1-4999-48f8-9ec4-9a24cdade7c9"}'
      - name: Provision Azure App Service Infrastructure
        id: provision
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          WEBAPP_NAME="accessapp-${TIMESTAMP}"

          az webapp create --name "$WEBAPP_NAME" --resource-group 'rg-Booster' --plan 'aspBoosterSites' --runtime "DOTNETCORE|${DOTNET_VERSION}"

          # Point SQLite to /home so it persists across restarts
          az webapp config appsettings set \
            --name "$WEBAPP_NAME" \
            --resource-group 'rg-Booster' \
            --settings ConnectionStrings__DefaultConnection="Data Source=/home/app.db"

          echo "webapp_name=$WEBAPP_NAME" >> $GITHUB_OUTPUT
          echo "✅ App deployed to: https://${WEBAPP_NAME}.azurewebsites.net"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.provision.outputs.webapp_name }}
          package: ./publish
